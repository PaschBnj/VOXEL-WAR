<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel War Mobile - Tactical FPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #111827;
            user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
        }
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        /* Mobile Controls */
        #mobile-controls {
            display: none; /* Controlado via JS */
        }
        
        /* Estilos comuns de Joystick */
        .joystick-base {
            position: absolute; bottom: 30px; width: 140px; height: 140px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%; pointer-events: auto;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
        }
        .joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Posicionamento */
        #joystick-left { left: 30px; }
        #joystick-right { right: 30px; }

        .action-btn {
            position: absolute; width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: white; pointer-events: auto;
            backdrop-filter: blur(4px);
            transition: transform 0.1s;
        }
        .action-btn:active { background: rgba(255, 215, 0, 0.5); transform: scale(0.90); }
        
        /* Botão de tiro ligeiramente maior para facilitar o drag */
        #shoot-btn { bottom: 180px; right: 40px; width: 90px; height: 90px; background: rgba(239, 68, 68, 0.4); font-size: 35px; border-color: rgba(239, 68, 68, 0.6); }
        #jump-btn { bottom: 130px; right: 140px; width: 60px; height: 60px; }
        #reload-btn { bottom: 40px; right: 200px; width: 50px; height: 50px; font-size: 16px; }

        @keyframes hitmarker {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }
        .hitmarker {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>');
            background-size: cover; opacity: 0; pointer-events: none;
        }
        .hit-active { animation: hitmarker 0.15s ease-out; }
        .damage-flash { position: absolute; inset: 0; background: red; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
        .regen-flash { position: absolute; inset: 0; box-shadow: inset 0 0 50px #10B981; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        
        .scope-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 30%, black 35%); z-index: 5; pointer-events: none; }
        .scope-crosshair { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: black; }
        .scope-crosshair-v { position: absolute; left: 50%; top: 0; height: 100%; width: 1px; background: black; }
        .card-select:active { transform: scale(0.95); border-color: #FBBF24; background-color: #374151; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer" class="ui-layer flex flex-col justify-between">
        <div id="damage-overlay" class="damage-flash"></div>
        <div id="regen-overlay" class="regen-flash"></div>

        <!-- HUD -->
        <div id="hud" class="hidden w-full h-full relative">
            
            <div class="absolute top-4 left-4 p-2 md:p-4 bg-gray-900 bg-opacity-80 rounded-xl border-l-4 border-red-500 shadow-lg transform skew-x-[-10deg]">
                <div class="text-[10px] md:text-xs text-gray-400 font-bold tracking-widest skew-x-[10deg]">KILLS</div>
                <div class="text-2xl md:text-4xl font-black text-white skew-x-[10deg]" id="kill-display">0</div>
            </div>

            <div class="absolute top-4 left-1/2 transform -translate-x-1/2 text-center">
                <div class="bg-gray-900 bg-opacity-80 px-4 py-1 md:px-6 md:py-2 rounded-b-xl border-t-4 border-yellow-500 shadow-lg">
                    <div class="text-xl md:text-3xl font-black text-white" id="timer">05:00</div>
                    <div class="text-[10px] text-gray-400 font-bold tracking-widest">TACTICAL</div>
                </div>
            </div>

            <div id="kill-feed" class="absolute top-16 right-4 flex flex-col items-end space-y-1 w-48 md:w-64"></div>

            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                <div id="crosshair-dot" class="w-1.5 h-1.5 bg-green-400 rounded-full shadow-[0_0_4px_#4ade80]"></div>
            </div>
            <div id="hitmarker-el" class="hitmarker"></div>
            
            <div id="scope-el" class="scope-overlay hidden">
                <div class="scope-crosshair"></div>
                <div class="scope-crosshair-v"></div>
            </div>

            <div class="absolute bottom-4 left-4 md:bottom-8 md:left-8 transition-transform pointer-events-none">
                <div class="flex items-end space-x-2">
                    <div class="text-4xl md:text-6xl font-black text-white drop-shadow-md" id="hp-display">100</div>
                    <div class="text-sm md:text-xl font-bold text-gray-400 mb-2 md:mb-3">HP</div>
                </div>
                <div class="w-32 md:w-72 h-3 md:h-4 bg-gray-800 rounded-full mt-1 overflow-hidden border border-gray-600">
                    <div id="hp-bar" class="h-full bg-gradient-to-r from-green-500 to-green-400 w-full transition-all duration-200"></div>
                </div>
            </div>

            <div class="absolute bottom-4 right-4 md:bottom-8 md:right-8 text-right transition-transform pointer-events-none" style="z-index: 5;">
                <div class="text-5xl md:text-7xl font-black text-yellow-400 italic drop-shadow-md" id="ammo-display">30</div>
                <div class="text-xs md:text-sm font-bold text-gray-400 tracking-widest uppercase" id="weapon-display">RIFLE</div>
            </div>
             
             <div id="reload-msg" class="absolute top-2/3 left-1/2 transform -translate-x-1/2 text-red-500 font-bold text-xl hidden animate-pulse">
                RECARREGANDO...
            </div>
        </div>

        <!-- Mobile Controls (Dual Joystick) -->
        <div id="mobile-controls" class="ui-layer interactive">
            <!-- Left Joystick (Movement) -->
            <div id="joystick-left" class="joystick-base">
                <div id="knob-left" class="joystick-knob"></div>
            </div>
            
            <!-- Right Joystick (Aim/Look) -->
            <div id="joystick-right" class="joystick-base">
                <div id="knob-right" class="joystick-knob"></div>
            </div>

            <!-- Shoot Button (Also acts as Aim Touchpad) -->
            <div id="shoot-btn" class="action-btn">🔫</div>
            
            <div id="jump-btn" class="action-btn">🦘</div>
            <div id="reload-btn" class="action-btn">🔄</div>
        </div>

        <!-- Menu Principal (Z-Index 50) -->
        <div id="main-menu" class="interactive absolute inset-0 bg-gray-900 flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] z-50">
            <div class="absolute inset-0 bg-black bg-opacity-70"></div>
            <div class="relative z-10 w-full max-w-4xl flex flex-col md:flex-row gap-8 p-4">
                <div class="flex-1 flex flex-col justify-center text-center md:text-left">
                    <h1 class="text-6xl md:text-8xl font-black text-white leading-none tracking-tighter mb-2 drop-shadow-xl"><span class="text-yellow-500">VOXEL</span><br>WAR</h1>
                    <p class="text-gray-400 font-mono mb-8">v3.6: Fire Button Aim</p>
                    <button onclick="toClassSelect()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-black text-2xl py-4 px-8 rounded shadow-[0_4px_0_rgb(180,83,9)] active:shadow-none active:translate-y-1 transition-all uppercase tracking-wide w-full md:w-auto">
                        JOGAR
                    </button>
                    <p class="mt-4 text-gray-500 text-xs md:text-sm">PC: WASD + Mouse | MOBILE: Dual Sticks + Drag Fire</p>
                </div>
            </div>
        </div>

        <!-- Seleção de Classe (Z-Index 50) -->
        <div id="class-select" class="interactive hidden absolute inset-0 bg-gray-900 bg-opacity-95 flex flex-col items-center justify-center p-4 z-50">
            <h2 class="text-3xl md:text-4xl font-black text-white mb-8 uppercase tracking-widest text-center">Escolha Classe</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-5xl overflow-y-auto max-h-[80vh]">
                <div onclick="startGame('assault')" ontouchstart="startGame('assault')" class="card-select bg-gray-800 border-2 border-gray-700 rounded-xl p-4 md:p-6 cursor-pointer hover:bg-gray-750">
                    <h3 class="text-2xl font-black text-blue-400">ASSALTO</h3>
                    <p class="text-gray-400 text-sm">Equilibrado. Tiro Rápido.</p>
                </div>
                <div onclick="startGame('sniper')" ontouchstart="startGame('sniper')" class="card-select bg-gray-800 border-2 border-gray-700 rounded-xl p-4 md:p-6 cursor-pointer hover:bg-gray-750">
                    <h3 class="text-2xl font-black text-red-400">SNIPER</h3>
                    <p class="text-gray-400 text-sm">Longo Alcance.</p>
                </div>
                <div onclick="startGame('shotgun')" ontouchstart="startGame('shotgun')" class="card-select bg-gray-800 border-2 border-gray-700 rounded-xl p-4 md:p-6 cursor-pointer hover:bg-gray-750">
                    <h3 class="text-2xl font-black text-green-400">ESCOPETA</h3>
                    <p class="text-gray-400 text-sm">Curto Alcance.</p>
                </div>
            </div>
            <button onclick="toMainMenu()" class="mt-8 text-gray-400 hover:text-white underline p-4 text-xl">Voltar</button>
        </div>

        <div id="death-screen" class="interactive hidden absolute inset-0 bg-red-900 bg-opacity-90 flex flex-col items-center justify-center z-50">
            <h1 class="text-4xl md:text-6xl font-black text-white mb-2 uppercase">Eliminado</h1>
            <p class="text-xl md:text-2xl text-red-200 mb-8">Morto por <span class="font-bold bg-black px-3 py-1 rounded text-white" id="killer-name">Inimigo</span></p>
            <button onclick="respawn()" class="bg-white text-red-900 font-black py-4 px-10 rounded shadow-lg text-xl active:scale-95 transition-transform uppercase">Respawn</button>
        </div>
    </div>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        function setControlsVisibility(visible) {
            const display = visible && isMobile ? 'block' : 'none';
            document.getElementById('mobile-controls').style.display = display;
        }
        setControlsVisibility(false);

        const AudioSys = {
            ctx: null,
            init: function() {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            },
            playTone: function(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playShoot: function(type) {
                if (!this.ctx) return;
                if (type === 'Sniper') { this.playTone(100, 'square', 0.5, 0.3); }
                else if (type === 'Shotgun') { this.playTone(60, 'sawtooth', 0.4, 0.4); this.playTone(40, 'square', 0.3, 0.3); }
                else { this.playTone(200 + Math.random()*50, 'sawtooth', 0.1, 0.1); }
            },
            playHit: function() { if (this.ctx) this.playTone(800, 'triangle', 0.1, 0.1); },
            playJump: function() { if (this.ctx) this.playTone(150, 'sine', 0.2, 0.1); },
            playRegen: function() { if (this.ctx) this.playTone(400, 'sine', 0.1, 0.05); }
        };

        const CONFIG = {
            fov: 80,
            sensitivity: 0.002,
            turnSpeedMobile: 2.5, // Velocidade de giro no mobile
            gravity: 30,
            jumpForce: 13,
            playerSpeed: 14,
            regenDelay: 15000, 
            regenRate: 5 
        };

        const CLASSES = {
            assault: { name: "Assalto", hp: 100, speed: 1.0, color: 0x3B82F6, weapon: { name: "Rifle", damage: 15, rpm: 600, auto: true, mag: 30, reload: 1500, spread: 0.03, pellets: 1 } },
            sniper: { name: "Sniper", hp: 80, speed: 0.95, color: 0xEF4444, weapon: { name: "AWP", damage: 100, rpm: 1500, auto: false, mag: 5, reload: 2500, spread: 0.001, scope: true, pellets: 1 } },
            shotgun: { name: "Escopeta", hp: 120, speed: 1.05, color: 0x10B981, weapon: { name: "Pump", damage: 10, pellets: 8, rpm: 1000, auto: false, mag: 6, reload: 2000, spread: 0.15 } }
        };

        let scene, camera, renderer, weaponGroup;
        let player = { mesh: null, velocity: new THREE.Vector3(), onGround: false, hp: 100, ammo: 30, isReloading: false, score: 0, kills: 0 };
        let input = { forward: false, backward: false, left: false, right: false, jump: false, shoot: false };
        let worldObjects = [], enemies = [];
        let lastTime = performance.now();
        let raycaster = new THREE.Raycaster();
        let moveRaycaster = new THREE.Raycaster();
        let gameActive = false;
        let lastShotTime = 0;
        let weaponMeshes = {};
        let lastDamageTime = 0;

        // Mobile Controls State
        let leftJoystick = { active: false, id: null, startX: 0, startY: 0, moveX: 0, moveY: 0 };
        let rightJoystick = { active: false, id: null, startX: 0, startY: 0, lookX: 0, lookY: 0 };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);
            scene.fog = new THREE.Fog(0x111827, 10, 80);

            camera = new THREE.PerspectiveCamera(CONFIG.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            weaponGroup = new THREE.Group();
            camera.add(weaponGroup);
            
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.BasicShadowMap;

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 1024;
            sun.shadow.mapSize.height = 1024;
            sun.shadow.camera.near = 0.5;
            sun.shadow.camera.far = 150;
            sun.shadow.camera.left = -60;
            sun.shadow.camera.right = 60;
            sun.shadow.camera.top = 60;
            sun.shadow.camera.bottom = -60;
            scene.add(sun);

            createWeaponModels();
            generateMap();
            
            const botCount = isMobile ? 6 : 10;
            for(let i=0; i<botCount; i++) spawnEnemy();

            setupInputs();

            window.addEventListener('resize', onResize);
            lastDamageTime = performance.now();
            animate();
        }

        function createWeaponModels() {
            const matDark = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const matMetal = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const rifle = new THREE.Group();
            rifle.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.6), matDark));
            const rBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.4), matMetal);
            rBarrel.position.set(0, 0.05, -0.5);
            rifle.add(rBarrel);
            rifle.position.set(0.3, -0.3, -0.5);
            rifle.visible = false;
            weaponGroup.add(rifle);
            weaponMeshes['assault'] = rifle;
            const sniper = new THREE.Group();
            sniper.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.7), matDark));
            const sBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.9), matMetal);
            sBarrel.position.set(0, 0, -0.8);
            sniper.add(sBarrel);
            sniper.position.set(0.3, -0.3, -0.6);
            sniper.visible = false;
            weaponGroup.add(sniper);
            weaponMeshes['sniper'] = sniper;
            const shotgun = new THREE.Group();
            shotgun.add(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.5), new THREE.MeshLambertMaterial({ color: 0x8B4513 })));
            const shBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.6), matMetal);
            shBarrel.position.set(0, 0.05, -0.55);
            shotgun.add(shBarrel);
            shotgun.position.set(0.3, -0.3, -0.5);
            shotgun.visible = false;
            weaponGroup.add(shotgun);
            weaponMeshes['shotgun'] = shotgun;
            scene.add(camera);
        }

        function generateMap() {
            const floorGeo = new THREE.BoxGeometry(120, 1, 120);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x374151 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            worldObjects.push(floor);
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x9CA3AF });
            const boxMat = new THREE.MeshLambertMaterial({ color: 0xF59E0B });
            const darkMat = new THREE.MeshLambertMaterial({ color: 0x1F2937 });
            function createBox(x, y, z, w, h, d, mat) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y + h/2, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                worldObjects.push(mesh);
            }
            createBox(0, 0, -60, 120, 10, 2, wallMat);
            createBox(0, 0, 60, 120, 10, 2, wallMat);
            createBox(-60, 0, 0, 2, 10, 120, wallMat);
            createBox(60, 0, 0, 2, 10, 120, wallMat);
            createBox(0, 0, 0, 10, 4, 10, darkMat);
            createBox(-40, 0, 0, 2, 6, 80, wallMat);
            createBox(-50, 0, -20, 4, 4, 4, boxMat);
            createBox(-50, 0, 20, 4, 4, 4, boxMat);
            createBox(40, 0, 0, 2, 6, 80, wallMat);
            createBox(50, 0, 10, 20, 4, 2, darkMat); 
            createBox(50, 0, -10, 20, 4, 2, darkMat);
            createBox(0, 0, -50, 40, 2, 10, wallMat);
            createBox(-15, 0, -45, 4, 1, 6, boxMat);
            createBox(-10, 0, 50, 4, 4, 4, boxMat);
            createBox(10, 0, 50, 4, 4, 4, boxMat);
            createBox(0, 4, 50, 4, 4, 4, boxMat);
            createBox(25, 0, 25, 3, 6, 3, darkMat);
            createBox(-25, 0, -25, 3, 6, 3, darkMat);
        }

        function createCharacterMesh(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.6), mat);
            body.position.y = 0.6; body.castShadow = true;
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xFFCCAA }));
            head.position.y = 1.5; head.castShadow = true;
            const eyeGeo = new THREE.BoxGeometry(0.15, 0.1, 0.05);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.15, 1.6, 0.3);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.15, 1.6, 0.3);
            group.add(eyeL, eyeR);
            const hitboxGeo = new THREE.BoxGeometry(1.5, 2.0, 1.5);
            const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });
            const hitbox = new THREE.Mesh(hitboxGeo, hitboxMat);
            hitbox.position.y = 1.0;
            hitbox.userData = { isHitbox: true, parentGroup: group };
            group.add(body, head, hitbox);
            group.userData = { hitbox };
            return group;
        }

        function spawnEnemy() {
            const keys = Object.keys(CLASSES);
            const type = keys[Math.floor(Math.random() * keys.length)];
            const cls = CLASSES[type];
            const mesh = createCharacterMesh(cls.color);
            let x, z, valid = false;
            for(let i=0; i<10; i++) {
                x = (Math.random()-0.5)*100;
                z = (Math.random()-0.5)*100;
                if (Math.abs(x) > 5 && Math.abs(z) > 5) { valid = true; break; }
            }
            if(!valid) x=0, z=50;
            mesh.position.set(x, 0.5, z);
            scene.add(mesh);
            enemies.push({
                mesh: mesh,
                hp: 100,
                class: cls,
                target: null,
                lastShot: 0,
                moveDir: new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize(),
                changeDirTimer: 0,
                name: "Bot_" + Math.floor(Math.random() * 999)
            });
        }

        function setupInputs() {
            // PC Inputs
            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') input.forward = true;
                if(e.code === 'KeyS') input.backward = true;
                if(e.code === 'KeyA') input.left = true;
                if(e.code === 'KeyD') input.right = true;
                if(e.code === 'Space') jump();
                if(e.code === 'KeyR') reload();
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') input.forward = false;
                if(e.code === 'KeyS') input.backward = false;
                if(e.code === 'KeyA') input.left = false;
                if(e.code === 'KeyD') input.right = false;
            });
            document.addEventListener('mousedown', () => { if(!isMobile && gameActive) input.shoot = true; });
            document.addEventListener('mouseup', () => { input.shoot = false; });
            document.addEventListener('mousemove', onMouseMove);

            document.getElementById('game-canvas').addEventListener('click', () => {
                if(gameActive && !isMobile) document.getElementById('game-canvas').requestPointerLock();
            });

            // MOBILE DUAL JOYSTICK SETUP
            if(isMobile) {
                // Função helper para Joystick
                function setupJoystick(zoneId, knobId, stateObj) {
                    const zone = document.getElementById(zoneId);
                    const knob = document.getElementById(knobId);
                    
                    zone.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const touch = e.changedTouches[0];
                        stateObj.id = touch.identifier;
                        stateObj.active = true;
                        stateObj.startX = touch.clientX;
                        stateObj.startY = touch.clientY;
                    }, {passive: false});

                    zone.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        if(!stateObj.active) return;
                        
                        let touch = null;
                        for(let i=0; i<e.changedTouches.length; i++) {
                            if(e.changedTouches[i].identifier === stateObj.id) touch = e.changedTouches[i];
                        }
                        if(!touch) return;

                        const deltaX = touch.clientX - stateObj.startX;
                        const deltaY = touch.clientY - stateObj.startY;
                        
                        const dist = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
                        const maxDist = 35; // Raio do joystick
                        const clampedDist = Math.min(dist, maxDist);
                        const angle = Math.atan2(deltaY, deltaX);
                        
                        // Visual
                        const knobX = Math.cos(angle) * clampedDist;
                        const knobY = Math.sin(angle) * clampedDist;
                        knob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

                        // Output Normalizado (-1 a 1)
                        const normX = knobX / maxDist;
                        const normY = knobY / maxDist;

                        if (zoneId === 'joystick-left') {
                            stateObj.moveX = normX;
                            stateObj.moveY = normY;
                            // Atualiza inputs globais baseados no analógico
                            input.forward = normY < -0.2;
                            input.backward = normY > 0.2;
                            input.left = normX < -0.2;
                            input.right = normX > 0.2;
                        } else {
                            // Joystick Direito (Camera)
                            stateObj.lookX = normX;
                            stateObj.lookY = normY;
                        }

                    }, {passive: false});

                    const endHandler = (e) => {
                        e.preventDefault();
                        let touch = null;
                        for(let i=0; i<e.changedTouches.length; i++) {
                            if(e.changedTouches[i].identifier === stateObj.id) touch = e.changedTouches[i];
                        }
                        if(!touch) return;

                        stateObj.active = false;
                        stateObj.id = null;
                        stateObj.moveX = 0; stateObj.moveY = 0;
                        stateObj.lookX = 0; stateObj.lookY = 0;
                        
                        knob.style.transform = `translate(-50%, -50%)`;
                        
                        if (zoneId === 'joystick-left') {
                            input.forward = false; input.backward = false;
                            input.left = false; input.right = false;
                        }
                    };
                    zone.addEventListener('touchend', endHandler);
                    zone.addEventListener('touchcancel', endHandler);
                }

                setupJoystick('joystick-left', 'knob-left', leftJoystick);
                setupJoystick('joystick-right', 'knob-right', rightJoystick);

                // Botões
                const btnJump = document.getElementById('jump-btn');
                btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
                const btnReload = document.getElementById('reload-btn');
                btnReload.addEventListener('touchstart', (e) => { e.preventDefault(); reload(); });

                // --- Lógica de Botão de Tiro com Mira (Touchpad Style) ---
                const btnShoot = document.getElementById('shoot-btn');
                let shootTouchId = null;
                let lastShootX = 0;
                let lastShootY = 0;

                btnShoot.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    input.shoot = true;
                    const touch = e.changedTouches[0];
                    shootTouchId = touch.identifier;
                    lastShootX = touch.clientX;
                    lastShootY = touch.clientY;
                }, {passive: false});

                btnShoot.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!input.shoot) return; 

                    let touch = null;
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === shootTouchId) {
                            touch = e.changedTouches[i];
                            break;
                        }
                    }
                    if (touch) {
                        const dx = touch.clientX - lastShootX;
                        const dy = touch.clientY - lastShootY;
                        
                        // Sensibilidade ao mirar enquanto atira
                        onMouseMove({ movementX: dx * 2.5, movementY: dy * 2.5 }); 
                        
                        lastShootX = touch.clientX;
                        lastShootY = touch.clientY;
                    }
                }, {passive: false});

                const endShoot = (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === shootTouchId) {
                            input.shoot = false;
                            shootTouchId = null;
                            break;
                        }
                    }
                };
                btnShoot.addEventListener('touchend', endShoot);
                btnShoot.addEventListener('touchcancel', endShoot);
            }
        }

        function onMouseMove(event) {
            if (!gameActive) return;
            camera.rotation.y -= event.movementX * CONFIG.sensitivity;
            camera.rotation.x -= event.movementY * CONFIG.sensitivity;
            camera.rotation.x = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, camera.rotation.x));
        }

        function jump() {
            if (player.onGround) {
                player.velocity.y = CONFIG.jumpForce;
                player.onGround = false;
                AudioSys.playJump();
            } else if (!gameActive && !document.getElementById('death-screen').classList.contains('hidden')) {
                respawn();
            }
        }

        // ... [Funções startGame, respawn, damagePlayer, die, shoot, createTracer, damageEnemy, reload, updateBots iguais] ...
        function startGame(className) {
            AudioSys.init();
            player.class = CLASSES[className];
            player.hp = player.class.hp;
            player.ammo = player.class.weapon.mag;
            player.score = 0;
            player.kills = 0;
            lastDamageTime = performance.now();
            
            Object.values(weaponMeshes).forEach(m => m.visible = false);
            if(weaponMeshes[className]) weaponMeshes[className].visible = true;

            updateHUD();
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('class-select').classList.add('hidden');
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            gameActive = true;
            camera.position.set(0, 5, 0);
            camera.rotation.set(0, 0, 0);
            player.mesh = camera; 
            player.velocity.set(0,0,0);
            
            if(isMobile) {
                setControlsVisibility(true);
            } else {
                document.getElementById('game-canvas').requestPointerLock();
            }
        }

        function respawn() {
            startGame(Object.keys(CLASSES).find(key => CLASSES[key].name === player.class.name).toLowerCase());
        }

        function damagePlayer(amount, sourceName) {
            if (!gameActive) return;
            player.hp -= amount;
            lastDamageTime = performance.now(); 
            const overlay = document.getElementById('damage-overlay');
            overlay.style.opacity = '0.5';
            setTimeout(() => overlay.style.opacity = '0', 100);
            updateHUD();
            if (player.hp <= 0) die(sourceName);
        }

        function die(killer) {
            gameActive = false;
            setControlsVisibility(false);
            if(!isMobile) document.exitPointerLock();
            document.getElementById('killer-name').innerText = killer || "Desconhecido";
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('death-screen').classList.remove('hidden');
        }

        function shoot() {
            if (player.ammo <= 0 || player.isReloading) {
                if(player.ammo <= 0) reload();
                return;
            }
            const now = performance.now();
            const fireInterval = 60000 / player.class.weapon.rpm;
            if (now - lastShotTime > fireInterval) {
                lastShotTime = now;
                player.ammo--;
                updateHUD();
                AudioSys.playShoot(player.class.name);
                camera.rotation.x += 0.01;
                const wpn = weaponMeshes[player.class.name.toLowerCase()];
                if(wpn) wpn.position.z += 0.1;
                const pellets = player.class.weapon.pellets || 1;
                let hitAnything = false;
                const targets = enemies.map(e => e.mesh.userData.hitbox).filter(h => h);
                const walls = worldObjects;
                for(let i = 0; i < pellets; i++) {
                    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                    const spread = player.class.weapon.spread;
                    raycaster.ray.direction.x += (Math.random() - 0.5) * spread;
                    raycaster.ray.direction.y += (Math.random() - 0.5) * spread;
                    raycaster.ray.direction.z += (Math.random() - 0.5) * spread;
                    raycaster.ray.direction.normalize();
                    const hits = raycaster.intersectObjects(targets);
                    const wallHits = raycaster.intersectObjects(walls);
                    let hitDist = 1000;
                    let hitWall = false;
                    if(wallHits.length > 0) {
                        hitDist = wallHits[0].distance;
                        hitWall = true;
                    }
                    if (hits.length > 0 && hits[0].distance < hitDist) {
                        const enemy = enemies.find(e => e.mesh.userData.hitbox === hits[0].object);
                        if (enemy) {
                            hitAnything = true;
                            damageEnemy(enemy, player.class.weapon.damage, "Você");
                            if (pellets === 1) createTracer(new THREE.Vector3(0.2, -0.2, -0.5), hits[0].point);
                        }
                    } else if (hitWall) {
                         if (pellets === 1) createTracer(new THREE.Vector3(0.2, -0.2, -0.5), wallHits[0].point);
                    } else {
                         if (pellets === 1) createTracer(new THREE.Vector3(0.2, -0.2, -0.5), raycaster.ray.direction.clone().multiplyScalar(50).add(camera.position));
                    }
                }
                if(hitAnything) { AudioSys.playHit(); showHitmarker(); }
            }
        }

        function createTracer(startRel, endPoint) {
            const start = camera.localToWorld(startRel.clone());
            start.y -= 0.1;
            const mat = new THREE.LineBasicMaterial({ color: 0xffff00 });
            const geo = new THREE.BufferGeometry().setFromPoints([start, endPoint]);
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            setTimeout(() => scene.remove(line), 50);
        }

        function damageEnemy(enemy, amount, attackerName) {
            enemy.hp -= amount;
            if (enemy.hp <= 0) {
                if (attackerName === "Você") {
                    player.score += 100;
                    player.kills += 1;
                    updateHUD();
                    addKillFeed("Você", "Bot");
                }
                scene.remove(enemy.mesh);
                enemies = enemies.filter(e => e !== enemy);
                spawnEnemy();
            }
        }

        function reload() {
            if (player.isReloading) return;
            player.isReloading = true;
            document.getElementById('reload-msg').classList.remove('hidden');
            const wpn = weaponMeshes[player.class.name.toLowerCase()];
            if(wpn) wpn.rotation.x = -0.5;
            setTimeout(() => {
                player.ammo = player.class.weapon.mag;
                player.isReloading = false;
                document.getElementById('reload-msg').classList.add('hidden');
                updateHUD();
                if(wpn) wpn.rotation.x = 0;
            }, player.class.weapon.reload);
        }

        function updateBots(delta) {
            enemies.forEach(bot => {
                const dist = bot.mesh.position.distanceTo(player.mesh.position);
                if(dist < 30) {
                    bot.mesh.lookAt(player.mesh.position.x, bot.mesh.position.y, player.mesh.position.z);
                    bot.mesh.translateZ(3 * delta);
                    const now = performance.now();
                    if(now - bot.lastShot > 1500) {
                        bot.lastShot = now;
                        moveRaycaster.set(bot.mesh.position, new THREE.Vector3().subVectors(player.mesh.position, bot.mesh.position).normalize());
                        const hits = moveRaycaster.intersectObjects(worldObjects);
                        if(hits.length === 0 || hits[0].distance > dist) {
                            AudioSys.playShoot('Assault');
                            if(Math.random() < 0.3) damagePlayer(10, "Bot");
                        }
                    }
                } else {
                    bot.changeDirTimer -= delta;
                    if(bot.changeDirTimer <= 0) {
                        bot.moveDir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize();
                        bot.changeDirTimer = 3;
                    }
                    bot.mesh.lookAt(bot.mesh.position.x + bot.moveDir.x, bot.mesh.position.y, bot.mesh.position.z + bot.moveDir.z);
                    bot.mesh.translateZ(2 * delta);
                }
            });
        }

        function updatePhysics(delta) {
            // Regen
            if (performance.now() - lastDamageTime > CONFIG.regenDelay && player.hp < 100 && player.hp > 0) {
                player.hp += CONFIG.regenRate * delta;
                if(player.hp > 100) player.hp = 100;
                const regenOverlay = document.getElementById('regen-overlay');
                regenOverlay.style.opacity = '0.3';
                updateHUD();
            } else {
                document.getElementById('regen-overlay').style.opacity = '0';
            }

            // --- CONTROLE DE MIRA PELO JOYSTICK DIREITO (Continuous Turn) ---
            if (isMobile && rightJoystick.active) {
                // Gira baseado na deflexão do joystick (X = Yaw, Y = Pitch)
                camera.rotation.y -= rightJoystick.lookX * CONFIG.turnSpeedMobile * delta;
                camera.rotation.x -= rightJoystick.lookY * CONFIG.turnSpeedMobile * delta;
                // Clamp Pitch
                camera.rotation.x = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, camera.rotation.x));
            }

            player.velocity.y -= CONFIG.gravity * delta;
            
            const speed = CONFIG.playerSpeed;
            let moveX = 0, moveZ = 0;

            if(input.forward) moveZ -= speed * delta;
            if(input.backward) moveZ += speed * delta;
            if(input.left) moveX -= speed * delta;
            if(input.right) moveX += speed * delta;

            const euler = new THREE.Euler(0, camera.rotation.y, 0, 'YXZ');
            const vec = new THREE.Vector3(moveX, 0, moveZ).applyEuler(euler);
            
            if(vec.lengthSq() > 0) {
                moveRaycaster.set(camera.position, vec.clone().normalize());
                const hits = moveRaycaster.intersectObjects(worldObjects);
                if(hits.length > 0 && hits[0].distance < 1) {
                    vec.set(0,0,0);
                }
            }

            camera.position.add(vec);

            if(camera.position.y + player.velocity.y * delta < 1.6) {
                player.velocity.y = 0;
                player.onGround = true;
                camera.position.y = 1.6;
            } else {
                player.onGround = false;
            }
            camera.position.y += player.velocity.y * delta;

            const wpn = weaponMeshes[player.class.name.toLowerCase()];
            if(wpn && wpn.position.z > -0.5) wpn.position.z -= delta;
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (gameActive) {
                updatePhysics(delta);
                updateBots(delta);
                if (input.shoot && player.class.weapon.auto) shoot();
                else if (input.shoot && !player.class.weapon.auto && !input.hasShot) { shoot(); input.hasShot = true; }
                if (!input.shoot) input.hasShot = false;
            }
            renderer.render(scene, camera);
        }

        function toClassSelect() { document.getElementById('main-menu').classList.add('hidden'); document.getElementById('class-select').classList.remove('hidden'); document.getElementById('class-select').classList.add('flex'); }
        function toMainMenu() { document.getElementById('class-select').classList.add('hidden'); document.getElementById('main-menu').classList.remove('hidden'); }
        function updateHUD() {
            document.getElementById('hp-display').innerText = Math.max(0, Math.floor(player.hp));
            document.getElementById('hp-bar').style.width = Math.max(0, player.hp) + '%';
            document.getElementById('ammo-display').innerText = player.ammo;
            document.getElementById('kill-display').innerText = player.kills;
        }
        function showHitmarker() {
            const el = document.getElementById('hitmarker-el');
            el.classList.remove('hit-active'); void el.offsetWidth; el.classList.add('hit-active');
        }
        function addKillFeed(killer, victim) {
            const feed = document.getElementById('kill-feed');
            const item = document.createElement('div');
            item.className = "bg-black bg-opacity-60 text-white px-2 py-1 rounded text-xs font-bold border-l-2 border-yellow-500 mb-1";
            item.innerText = `${killer} > ${victim}`;
            feed.appendChild(item); setTimeout(() => item.remove(), 3000);
        }
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
